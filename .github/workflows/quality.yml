name: LMTY Quality Gates

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Complexity audit
        run: |
          PYTHONPATH=. python scripts/complexity_audit.py > reports/complexity_audit.json
          python -c "import json; d=json.load(open('reports/complexity_audit.json')); assert d['max_complexity'] <= 2, d['over_target']"
      - name: Reproducible POC run
        run: PYTHONPATH=. python scripts/run_poc.py
      - name: Verify reports
        run: test -s reports/POC_TECHNICAL_REPORT.md && test -s reports/benchmark.json && test -s reports/optimizer_scores.json
